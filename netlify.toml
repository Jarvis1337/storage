[build]
  command = "node build.js"
  publish = "."

# Static hosting can't run server logic, so every path — including
# "asset" paths like /img/icon.png — has to resolve to index.html.
# script.js then looks at location.pathname and decides whether to
# show the dashboard or a chrome-free asset view.
# Real files (style.css, script.js, storagebox-manifest.json, and
# everything under StorageBox/) are served as-is by Netlify before
# this catch-all is ever consulted — that's default behavior as long
# as "force" is not set to true here, so it's left out on purpose.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
